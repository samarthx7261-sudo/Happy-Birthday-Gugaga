<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAPPY BIRTHDAY TO MY HG</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none}
canvas{display:block;position:fixed;inset:0}
h1{display:none}
h1{position:fixed;top:0;left:0;right:0;margin:0;padding:calc(env(safe-area-inset-top,0px) + 22px) 12px 0;text-align:center;color:#fff;font:800 clamp(22px,6.4vw,46px)/1.25 "Poppins","Segoe UI",system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;text-shadow:0 0 14px rgba(255,255,255,.55),0 0 34px rgba(255,80,120,.45);pointer-events:none;z-index:2}
</style></head><body>
<h1>HAPPY BIRTHDAY<br>TO MY HG ILYSM</h1>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=Math.random;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,1,.1,100);
var titleG=null;
function fit(){
  renderer.setSize(innerWidth,innerHeight);
  const a=innerWidth/innerHeight;camera.aspect=a;
  const d=Math.max(26,10.5/(2*Math.tan(25*Math.PI/180)*a));
  camera.position.set(0,0,d);camera.lookAt(0,0,0);camera.updateProjectionMatrix();
  if(titleG){const half=d*Math.tan(25*Math.PI/180),s=Math.min(1,half*2*a*.94/9.6);titleG.scale.set(s,s,s);titleG.position.y=half-1.35*s-1;tm.uniforms.uSize.value=.105*s;tm.uniforms.uPx.value=innerHeight*renderer.getPixelRatio()/(2*Math.tan(25*Math.PI/180));}
}
addEventListener('resize',fit);fit();

// soft round dot texture
const dc=document.createElement('canvas');dc.width=dc.height=64;
const g=dc.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);
gr.addColorStop(0,'#fff');gr.addColorStop(.45,'#fff');gr.addColorStop(1,'rgba(255,255,255,0)');
g.fillStyle=gr;g.fillRect(0,0,64,64);
const dot=new THREE.CanvasTexture(dc);

function mkPoints(pos,col,size,op){
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  return new THREE.Points(geo,new THREE.PointsMaterial({size:size,map:dot,vertexColors:true,transparent:true,opacity:op,depthWrite:false,blending:THREE.AdditiveBlending}));
}

const world=new THREE.Group();scene.add(world);

/* ---------- CAKE (particles) ---------- */
const cake=new THREE.Group();cake.position.y=-9;world.add(cake);
const P=[],C=[];
function add(x,y,z,c,j){const k=(1-j)+R()*j*2;P.push(x,y,z);C.push(c[0]*k,c[1]*k,c[2]*k);}
const sponge=[.85,.5,.2],cream=[.95,.8,.65],pink=[.95,.35,.55],plate=[.7,.55,.35];
for(let i=0;i<1400;i++){const r=Math.sqrt(R())*3.9,a=R()*6.283;add(Math.cos(a)*r,-.05,Math.sin(a)*r,plate,.25);}
const tiers=[[3,1.2,0],[2.2,1.1,1.2],[1.4,1,2.3]];
tiers.forEach((t,i)=>{
  const r=t[0],h=t[1],y0=t[2];
  const ns=Math.floor(r*r*420);
  for(let k=0;k<ns;k++){
    const a=R()*6.283,y=R()*h,lim=h-(.15+.3*Math.max(0,Math.sin(a*6+i)));
    let c=sponge;
    if(y>lim)c=pink;
    else if(Math.abs(y-h*.5)<.07)c=cream;
    add(Math.cos(a)*r,y0+y,Math.sin(a)*r,c,.18);
  }
  const nt=Math.floor(r*r*150);
  for(let k=0;k<nt;k++){const rr=Math.sqrt(R())*r,a=R()*6.283;add(Math.cos(a)*rr,y0+h,Math.sin(a)*rr,R()<.85?pink:cream,.15);}
  for(let k=0;k<Math.floor(r*10);k++){const a=k/(r*10)*6.283;add(Math.cos(a)*(r-.05),y0+h+.08,Math.sin(a)*(r-.05),[1,.9,.95],.1);}
});
for(let k=0;k<420;k++){const a=R()*6.283,y=R()*1.3;add(Math.cos(a)*.12,3.3+y,Math.sin(a)*.12,Math.floor(y*8)%2?[1,.2,.25]:[1,.9,.9],.1);}
cake.add(mkPoints(P,C,.05,.95));

// flame
const FN=420,fph=[],fa=[],fp=new Array(FN*3).fill(0),fc=new Array(FN*3).fill(1);
for(let i=0;i<FN;i++){fph.push(R());fa.push(R()*6.283);}
const flame=mkPoints(fp,fc,.13,1);flame.position.y=4.6;cake.add(flame);
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:dot,color:0xffa733,transparent:true,opacity:.5,depthWrite:false,blending:THREE.AdditiveBlending}));
glow.position.y=5.05;glow.scale.set(1.8,1.8,1);cake.add(glow);
function updFlame(t){
  const pa=flame.geometry.attributes.position.array,ca=flame.geometry.attributes.color.array;
  for(let i=0;i<FN;i++){
    const u=(t*1.4+fph[i])%1,r=(1-u)*.16*Math.sqrt((fph[i]*7)%1+.05),k=1-u;
    pa[i*3]=Math.cos(fa[i]+t*3)*r+Math.sin(t*8+u*3)*.05*u;
    pa[i*3+1]=u*.95;
    pa[i*3+2]=Math.sin(fa[i]+t*3)*r;
    ca[i*3]=1;ca[i*3+1]=.35+.65*k*k;ca[i*3+2]=.1+.5*Math.pow(k,4);
  }
  flame.geometry.attributes.position.needsUpdate=true;
  flame.geometry.attributes.color.needsUpdate=true;
  const f=1.7+.25*Math.sin(t*13)+.15*Math.sin(t*5.3);
  glow.scale.set(f,f,1);
}

/* ---------- HEART of "I love you" words ---------- */
const heart=new THREE.Group();heart.position.y=3.6;world.add(heart);
const phrases=["I love you","Main tumse pyaar karta hoon","मैं तुमसे प्यार करता हूँ","Te amo","Te quiero","Je t'aime","Ich liebe dich","Ti amo","Eu te amo","Ik hou van je","Jag älskar dig","Jeg elsker deg","Te iubesc","Seni seviyorum","Ya tebya lyublyu","사랑해","愛してる","我爱你","أحبك","אני אוהב אותך","Σ'αγαπώ","Mahal kita","Aku cinta kamu","Anh yêu em","Nakupenda","Ngiyakuthanda","Szeretlek","Miluji tě","Kocham cię","Rakastan sinua","Ég elska þig","Mi amas vin","Volim te","Mina armastan sind","Es tevi mīlu","Aš tave myliu","আমি তোমাকে ভালোবাসি","நான் உன்னை காதலிக்கிறேன்","مجھے تم سے محبت ہے","ฉันรักเธอ","Ndinokuda","Ni upendo wangu"];
const tex=phrases.map(function(s){
  const c=document.createElement('canvas'),x=c.getContext('2d');
  const f='bold 44px "Noto Sans","Segoe UI","Nirmala UI",system-ui,sans-serif';
  x.font=f;const w=Math.ceil(x.measureText(s).width)+16;
  c.width=w;c.height=70;x.font=f;x.textBaseline='middle';x.textAlign='center';x.fillStyle='#fff';x.fillText(s,w/2,36);
  const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;t.generateMipmaps=false;
  return {t:t,a:w/70};
});
const words=[];let tries=0;const S=3.2;
while(words.length<160&&tries++<30000){
  const x=R()*2.7-1.35,y=R()*2.6-1.25;
  if(Math.pow(x*x+y*y-1,3)-x*x*y*y*y>0)continue;
  const z=(R()-.5)*1.7*Math.max(.25,1-(x*x+y*y)*.35);
  const q=tex[Math.floor(R()*tex.length)];
  const m=new THREE.SpriteMaterial({map:q.t,transparent:true,opacity:0,depthWrite:false});
  if(R()<.07)m.color.setHSL(.97,.8,.85);else m.color.setHSL((345+R()*20)/360,.92,.42+R()*.2);
  const sp=new THREE.Sprite(m),h=.26+R()*.16;
  sp.scale.set(h*q.a,h,1);sp.position.set(x*S,y*S,z*S*.8);
  sp.userData={d:Math.sqrt(x*x+y*y)*.7+R()*.6,o:.65+R()*.35,ph:R()*6.28};
  heart.add(sp);words.push(sp);
}

/* ---------- floating sparkles ---------- */
const DN=350,dp=[],dcol=[];
for(let i=0;i<DN;i++){dp.push((R()-.5)*14,(R()-.5)*22,(R()-.5)*10);const w=R();dcol.push(1,.5+w*.4,.6+w*.35);}
const dust=mkPoints(dp,dcol,.06,.6);scene.add(dust);

/* ---------- CODE-STYLE TITLE (every dot is a code character) ---------- */
const tc=document.createElement('canvas');tc.width=1400;tc.height=400;
const tx=tc.getContext('2d');
const lines=['HAPPY BIRTHDAY','TO MY HG ILYSM'];
const MONO='Consolas,Menlo,"Courier New",monospace';
let fs=160;tx.font='bold '+fs+'px '+MONO;
fs=Math.floor(fs*1300/tx.measureText(lines[1]).width);
tx.font='bold '+fs+'px '+MONO;tx.textAlign='center';tx.textBaseline='middle';
tx.fillStyle='#fff';tx.strokeStyle='#fff';tx.lineWidth=5;
lines.forEach((l,i)=>{tx.fillText(l,700,110+i*180);tx.strokeText(l,700,110+i*180);});
const id=tx.getImageData(0,0,1400,400).data,U=9.6/1400,tp=[],tf=[],tch=[],tdl=[];
for(let y=0;y<400;y+=8)for(let x=0;x<1400;x+=8){
  if(id[(y*1400+x)*4+3]>128){tp.push((x-700)*U,-(y-200)*U,0);tf.push((R()-.5)*16,(R()-.5)*12,(R()-.5)*8);tch.push(Math.floor(R()*16));tdl.push(x/1400*1.6+R()*.5);}
}
const ac=document.createElement('canvas');ac.width=1024;ac.height=64;
const ax=ac.getContext('2d');ax.fillStyle='#fff';ax.font='bold 54px '+MONO;ax.textAlign='center';ax.textBaseline='middle';
'01{}<>/;=+*#$%&@'.split('').forEach((c,i)=>ax.fillText(c,i*64+32,34));
const atlas=new THREE.CanvasTexture(ac);
const tg=new THREE.BufferGeometry();
tg.setAttribute('position',new THREE.Float32BufferAttribute(tp,3));
tg.setAttribute('aFrom',new THREE.Float32BufferAttribute(tf,3));
tg.setAttribute('ch',new THREE.Float32BufferAttribute(tch,1));
tg.setAttribute('dl',new THREE.Float32BufferAttribute(tdl,1));
const tm=new THREE.ShaderMaterial({
  uniforms:{uT:{value:0},uSize:{value:.105},uPx:{value:600},uTex:{value:atlas}},
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:'attribute vec3 aFrom;attribute float ch;attribute float dl;uniform float uT;uniform float uSize;uniform float uPx;varying float vCh;varying float vA;'+
  'void main(){float k=clamp((uT-dl)/1.6,0.,1.);k=1.-pow(1.-k,3.);vec3 p=mix(aFrom,position,k);p.y+=sin(uT*2.+position.x*2.)*.02*k;'+
  'float fl=step(.985,fract(sin(dl*91.7+floor(uT*2.))*437.5))*floor(uT*7.);'+
  'vCh=mod(ch+(k<1.?floor(uT*12.):0.)+fl,16.);vA=k*.6+.4*step(.999,k);'+
  'vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;gl_PointSize=uSize*uPx/(-mv.z);}',
  fragmentShader:'uniform sampler2D uTex;varying float vCh;varying float vA;'+
  'void main(){if(vA<.01)discard;float a=texture2D(uTex,vec2((gl_PointCoord.x+vCh)/16.,1.-gl_PointCoord.y)).a;if(a<.1)discard;gl_FragColor=vec4(vec3(1.),a);}'
});
const tpts=new THREE.Points(tg,tm);tpts.frustumCulled=false;
titleG=new THREE.Group();titleG.add(tpts);scene.add(titleG);fit();

/* ---------- interaction ---------- */
let rotY=0,rotX=0,drag=false,lx=0,ly=0;
addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
addEventListener('pointermove',e=>{if(!drag)return;rotY+=(e.clientX-lx)*.01;rotX=Math.max(-.4,Math.min(.4,rotX+(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY;});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointercancel',()=>drag=false);

const clock=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const t=clock.getElapsedTime();
  if(!drag)rotY+=.006;
  world.rotation.y=rotY;world.rotation.x=rotX;
  updFlame(t);tm.uniforms.uT.value=t;
  const b=1+.045*Math.pow(Math.abs(Math.sin(t*2.6)),8);
  heart.scale.set(b,b,b);
  for(const s of words){
    const k=Math.min(1,Math.max(0,(t-.6-s.userData.d)/.7));
    s.material.opacity=k*s.userData.o*(.8+.2*Math.sin(t*2+s.userData.ph));
  }
  const pa=dust.geometry.attributes.position.array;
  for(let i=0;i<DN;i++){pa[i*3+1]+=.012;if(pa[i*3+1]>11)pa[i*3+1]=-11;}
  dust.geometry.attributes.position.needsUpdate=true;
  renderer.render(scene,camera);
})();
</script>
</body></html>
