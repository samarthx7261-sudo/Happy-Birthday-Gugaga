<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday To My Hg Lysm! 🎉</title>
    <style>
        /* ==========================================================================
           ABSOLUTE PEAK: HIGH-GRAPHICS 2D CINEMATIC TERMINAL ENGINE STYLESHEET
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.99);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            cursor: pointer;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #start-btn {
            background: linear-gradient(135deg, #ffb703, #ff5964, #7209b7, #4cc9f0, #f72585);
            background-size: 400% 400%;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 21px;
            font-weight: bold;
            padding: 22px 48px;
            border: none;
            border-radius: 50px;
            box-shadow: 0 0 50px rgba(255, 183, 3, 0.85);
            cursor: pointer;
            animation: gradientShift 4s ease infinite, neonPulse 1.5s infinite alternate;
            letter-spacing: 1.5px;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes neonPulse {
            0% { transform: scale(1); box-shadow: 0 0 25px rgba(255, 183, 3, 0.75); }
            100% { transform: scale(1.07); box-shadow: 0 0 60px rgba(255, 89, 100, 0.98); }
        }
        #terminal-wrapper {
            background: #010101;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid #222;
            box-shadow: 0 0 80px rgba(255, 140, 0, 0.25);
        }
        #terminal-screen {
            text-align: center;
            white-space: pre;
            font-size: 5.1px;
            line-height: 5.6px;
            font-weight: bold;
        }

        /* Maximum High-Definition Multi-Color Neon Palette */
        .c-gold   { color: #ffb703; text-shadow: 0 0 10px rgba(255, 183, 3, 0.95); }
        .c-pink   { color: #ff5964; text-shadow: 0 0 10px rgba(255, 89, 100, 0.95); }
        .c-cyan   { color: #6fffe9; text-shadow: 0 0 10px rgba(111, 255, 233, 0.95); }
        .c-purple { color: #f72585; text-shadow: 0 0 10px rgba(247, 37, 133, 0.95); }
        .c-blue   { color: #4cc9f0; text-shadow: 0 0 10px rgba(76, 201, 240, 0.95); }
        .c-white  { color: #ffffff; text-shadow: 0 0 8px rgba(255, 255, 255, 0.95); }
        .c-flame  { color: #ff4800; text-shadow: 0 0 25px #ffb703, 0 0 50px #ff4800, 0 0 75px #ff0054; }
        .c-sparkle{ color: #e0aaff; text-shadow: 0 0 8px rgba(224, 170, 255, 0.9); }
        .c-plate  { color: #e9ecef; text-shadow: 0 0 7px rgba(233, 236, 239, 0.8); }
        .c-cake   { color: #ffccd5; text-shadow: 0 0 7px rgba(255, 204, 213, 0.9); } /* Strawberry Cream */
        .c-frost  { color: #fff1e6; text-shadow: 0 0 8px rgba(255, 241, 230, 0.98); } /* Vanilla Icing */
        .c-wick   { color: #495057; }
    </style>
</head>
<body>

    <!-- Interactive Audio & Cinematic Build Trigger Overlay -->
    <div id="start-overlay" onclick="launchExperience()">
        <button id="start-btn">🎁 Tap to Build & Play Music 🎶</button>
        <p style="color: #adb5bd; margin-top: 25px; font-size: 16px; letter-spacing: 2px;">Max-Level High-Graphics For My Hg Lysm ✨</p>
    </div>

    <!-- Main Terminal Display Container -->
    <div id="terminal-wrapper">
        <div id="terminal-screen">Loading Ultimate 2D Cinematic Engine...</div>
    </div>

    <script>
        /* ==========================================================================
           ULTIMATE SIMULATION & POLYPHONIC SYNTHESIZER ENGINE (MAXED OUT)
           ========================================================================== */
        const screen = document.getElementById('terminal-screen');
        const overlay = document.getElementById('start-overlay');
        
        let simTime = 0.0;
        let audioCtx = null;
        let musicActive = false;

        // Rich Polyphonic Happy Birthday Melody Array
        const songNotes = [
            {f: 392, d: 240}, {f: 392, d: 240}, {f: 440, d: 480}, {f: 392, d: 480}, {f: 523, d: 480}, {f: 494, d: 960},
            {f: 392, d: 240}, {f: 392, d: 240}, {f: 440, d: 480}, {f: 392, d: 480}, {f: 587, d: 480}, {f: 523, d: 960},
            {f: 392, d: 240}, {f: 392, d: 240}, {f: 784, d: 480}, {f: 659, d: 480}, {f: 523, d: 480}, {f: 494, d: 480}, {f: 440, d: 960},
            {f: 698, d: 240}, {f: 698, d: 240}, {f: 659, d: 480}, {f: 523, d: 480}, {f: 587, d: 480}, {f: 523, d: 1200}
        ];

        function startMusicSynthLoop() {
            if (!musicActive || !audioCtx) return;
            
            songNotes.forEach((note, index) => {
                setTimeout(() => {
                    if (!musicActive || !audioCtx) return;
                    try {
                        let osc = audioCtx.createOscillator();
                        let gainNode = audioCtx.createGain();
                        
                        osc.type = 'triangle'; // Clean music box timbre
                        osc.frequency.setValueAtTime(note.f, audioCtx.currentTime);
                        
                        gainNode.gain.setValueAtTime(0.16, audioCtx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.0003, audioCtx.currentTime + (note.d / 1000));
                        
                        osc.connect(gainNode);
                        gainNode.connect(audioCtx.destination);
                        
                        osc.start();
                        osc.stop(audioCtx.currentTime + (note.d / 1000));
                    } catch(err) {}
                }, songNotes.slice(0, index).reduce((acc, curr) => acc + curr.dur, 0));
            });

            let totalCycleTime = songNotes.reduce((acc, curr) => acc + curr.dur, 0);
            setTimeout(() => {
                if (musicActive) startMusicSynthLoop();
            }, totalCycleTime + 1000);
        }

        function launchExperience() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) {}

            musicActive = true;
            startMusicSynthLoop();
            
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 800);
        }

        // Maximum Detail Frame Calculation Engine
        function computeFrame() {
            let cols = 104;
            let rows = 70;
            let grid = Array(rows).fill(0).map(() => Array(cols).fill({ char: ' ', cls: 'c-white' }));

            let stage = Math.min(simTime, 16.0);

            // 1. Grand Neon Banner Reveal: HAPPY BIRTHDAY TO MY HG LYSM (Reveals smoothly at stage >= 4.0)
            if (stage >= 4.0) {
                const bannerLines = [
                    "H  H   A   PPPPP  PPPP   Y   Y      BBBB   IIIII  RRRR   TTTTT  H  H   A   Y   Y",
                    "H  H  A A  P    P P    P  Y Y       B   B    I    R   R    T    H  H  A A   Y Y ",
                    "HHHH  AAA  PPPPP  PPPPP    Y        BBBB     I    RRRR     T    HHHH  AAA    Y  ",
                    "H  H  A A  P      P        Y        B   B    I    R R      T    H  H  A A    Y  ",
                    "H  H  A A  P      P        Y        BBBB   IIIII  R  R     T    H  H  A A    Y  ",
                    "          T  O        M  Y        H  G       L  Y  S  M                       "
                ];

                for (let r = 0; r < bannerLines.length; r++) {
                    let rStr = bannerLines[r];
                    for (let c = 0; c < rStr.length; c++) {
                        let ch = rStr[c];
                        if (ch !== ' ' && r + 1 < rows && c + 3 < cols) {
                            let clrClass = (r === 5) ? 'c-cyan' : ((c % 4 === 0) ? 'c-gold' : (c % 4 === 1 ? 'c-pink' : (c % 4 === 2 ? 'c-purple' : 'c-blue')));
                            grid[r + 1][c + 3] = { char: ch, cls: clrClass };
                        }
                    }
                }
            }

            // 2. High-Density Falling Sparkles & Confetti Particles (Stage >= 1.5)
            if (stage >= 1.5) {
                for (let y = 8; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        let noiseVal = Math.sin(x * 16.5 + y * 9.8 + simTime * 4.8) * Math.cos(x * 4.8 - y * 7.8);
                        if (noiseVal > 0.83) {
                            let pChars = ['.', '*', '+', '•', '°', '`', '~', '·', 'x', 'o', '★'];
                            let pIdx = Math.floor(Math.abs(Math.sin(x * 8 + y * 14 + simTime * 11) * 130)) % pChars.length;
                            grid[y][x] = { char: pChars[pIdx], cls: 'c-sparkle' };
                        }
                    }
                }
            }

            // 3. Step-by-Step Progressive Cake Building Simulation (Plate -> Cake -> Candle -> Flame)
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let nx = (x - 52) / 7.8;
                    let ny = (y - 44) / 3.2;

                    // STEP 1: Metallic Silver Plate Forms First (Stage >= 1.0)
                    if (stage >= 1.0 && ny >= 2.5 && ny < 2.9 && Math.abs(nx) < 4.8) {
                        let pChar = (Math.abs(nx) > 4.4) ? '~' : '=';
                        grid[y][x] = { char: pChar, cls: 'c-plate' };
                    }

                    // STEP 2: Strawberry Cream Cake Layers Rise Up Smoothly from the Plate (Stage >= 2.0)
                    let riseProgress = Math.min(2.4, (stage - 2.0) * 1.3);
                    if (stage >= 2.0 && ny >= (2.5 - riseProgress) && ny < 2.5 && Math.abs(nx) < 3.1 - (ny * 0.10)) {
                        let rowMod = Math.floor(ny * 4) % 2;
                        let isIcing = (ny < (3.5 - riseProgress + 0.3) || rowMod === 0);
                        
                        let cakeBodyChars = ['#', '%', '@', 'X', ':', '*', '='];
                        let cakeFrostChars = ['~', '_', '•', '.'];
                        
                        let chosenChar = isIcing 
                            ? cakeFrostChars[Math.floor(Math.abs(Math.sin(x * 3 + y * 5 + simTime) * 60)) % cakeFrostChars.length]
                            : cakeBodyChars[Math.floor(Math.abs(Math.sin(x * 7 + y * 9 - simTime * 2) * 80)) % cakeBodyChars.length];
                        
                        grid[y][x] = { char: chosenChar, cls: isIcing ? 'c-frost' : 'c-cake' };
                    }

                    // STEP 3: Candle Stick Emerges Right in the Center (Stage >= 5.0)
                    if (stage >= 5.0 && ny >= -1.4 && ny < 0.0 && Math.abs(nx) < 0.28) {
                        let wickSymbol = (ny > -0.2) ? '|' : '!';
                        grid[y][x] = { char: wickSymbol, cls: (ny > -0.2) ? 'c-wick' : 'c-cyan' };
                    }

                    // STEP 4: Multi-Color Flickering Flame Ignites on Top of Candle (Stage >= 6.0)
                    if (stage >= 6.0) {
                        let flameFlicker = Math.sin(simTime * 18.5) * 0.15 + Math.cos(simTime * 26.5) * 0.10;
                        let flameDist = Math.pow(nx, 2) + Math.pow(ny + 2.0 - flameFlicker, 2);
                        
                        let flameLimit = 0.44 + Math.sin(simTime * 11.5 + nx * 7.5) * 0.09;
                        if (flameDist < flameLimit) {
                            let flameSymbols = ['&', '*', 'o', 'v', '^', 'x', 'W', 'Q', '#', '@'];
                            let fIdx = Math.floor(Math.abs(Math.sin(x * 16.8 + y * 23.0 - simTime * 16.5) * 110)) % flameSymbols.length;
                            grid[y][x] = { char: flameSymbols[fIdx], cls: 'c-flame' };
                        }
                    }
                }
            }

            // High-Performance HTML Buffer Rendering
            let finalHtmlBuffer = "";
            for (let y = 0; y < rows; y++) {
                let lineStr = "";
                for (let x = 0; x < cols; x++) {
                    let cell = grid[y][x];
                    if (cell.char === ' ') {
                        lineStr += ' ';
                    } else {
                        lineStr += `<span class="${cell.cls}">${cell.char}</span>`;
                    }
                }
                finalHtmlBuffer += lineStr + "\n";
            }
            screen.innerHTML = finalHtmlBuffer;
            
            // Advance Simulation Clock Counter smoothly
            simTime += 0.10;
            if (simTime > 22.0) {
                simTime = 6.0; // Perfect loop keeping the animation lively and fully active
            }
        }

        // Run simulation loop at 50ms for buttery-smooth max-level high-graphics performance
        setInterval(computeFrame, 50);
    </script>
</body>
</html>
