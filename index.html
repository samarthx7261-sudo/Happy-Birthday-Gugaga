<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday To My Hg! 🎉</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #010101;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(1, 1, 1, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.6s ease;
        }
        #start-btn {
            background: linear-gradient(135deg, #ffb703, #ff5964, #7209b7);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 19px;
            font-weight: bold;
            padding: 16px 34px;
            border: none;
            border-radius: 35px;
            box-shadow: 0 0 30px rgba(255, 183, 3, 0.7);
            cursor: pointer;
            animation: neonPulse 1.5s infinite alternate;
        }
        @keyframes neonPulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 183, 3, 0.6); }
            100% { transform: scale(1.06); box-shadow: 0 0 40px rgba(255, 89, 100, 0.9); }
        }
        #terminal-container {
            background: #050505;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #1f1f1f;
            box-shadow: 0 0 40px rgba(255, 140, 0, 0.2);
        }
        #terminal-screen {
            text-align: center;
            white-space: pre;
            font-size: 6.8px;
            line-height: 7.4px;
            font-weight: bold;
        }
        /* Advanced Multi-Color Neon Palette */
        .c-gold   { color: #ffb703; text-shadow: 0 0 7px rgba(255, 183, 3, 0.8); }
        .c-pink   { color: #ff5964; text-shadow: 0 0 7px rgba(255, 89, 100, 0.8); }
        .c-cyan   { color: #6fffe9; text-shadow: 0 0 7px rgba(111, 255, 233, 0.8); }
        .c-purple { color: #b5179e; text-shadow: 0 0 7px rgba(181, 23, 158, 0.8); }
        .c-white  { color: #ffffff; text-shadow: 0 0 5px rgba(255, 255, 255, 0.9); }
        .c-flame  { color: #ff4800; text-shadow: 0 0 16px #ffb703, 0 0 30px #ff4800; }
        .c-sparkle{ color: #e0aaff; text-shadow: 0 0 5px rgba(224, 170, 255, 0.6); }
        .c-plate  { color: #adb5bd; text-shadow: 0 0 4px rgba(173, 181, 189, 0.5); }
        .c-cake   { color: #bc6c25; text-shadow: 0 0 5px rgba(188, 108, 37, 0.6); }
        .c-frost  { color: #faedcd; text-shadow: 0 0 6px rgba(250, 237, 205, 0.8); }
        .c-wick   { color: #495057; }
    </style>
</head>
<body>
    <div id="start-overlay" onclick="initializeExperience()">
        <button id="start-btn">🎁 Tap to Build & Play Music 🎶</button>
        <p style="color: #adb5bd; margin-top: 18px; font-size: 14px; letter-spacing: 1px;">Special Animation For My Hg ✨</p>
    </div>

    <div id="terminal-container">
        <div id="terminal-screen">Loading NumPy Matrix Simulation Engine...</div>
    </div>

    <script>
        const screen = document.getElementById('terminal-screen');
        const overlay = document.getElementById('start-overlay');
        let simulationTime = 0.0;
        let audioContext = null;
        let audioRunning = false;

        // Happy Birthday Synth Melody Notes
        const musicalNotes = [
            {freq: 392, dur: 240}, {freq: 392, dur: 240}, {freq: 440, dur: 480}, {freq: 392, dur: 480}, {freq: 523, dur: 480}, {freq: 494, dur: 960},
            {freq: 392, dur: 240}, {freq: 392, dur: 240}, {freq: 440, dur: 480}, {freq: 392, dur: 480}, {freq: 587, dur: 480}, {freq: 523, dur: 960},
            {freq: 392, dur: 240}, {freq: 392, dur: 240}, {freq: 784, dur: 480}, {freq: 659, dur: 480}, {freq: 523, dur: 480}, {freq: 494, dur: 480}, {freq: 440, dur: 960},
            {freq: 698, dur: 240}, {freq: 698, dur: 240}, {freq: 659, dur: 480}, {freq: 523, dur: 480}, {freq: 587, dur: 480}, {freq: 523, dur: 1200}
        ];

        function playMelodyLoop() {
            if (!audioRunning) return;
            
            musicalNotes.forEach((n, idx) => {
                setTimeout(() => {
                    if (!audioRunning) return;
                    try {
                        let osc = audioContext.createOscillator();
                        let gainNode = audioContext.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = n.freq;
                        
                        gainNode.gain.setValueAtTime(0.12, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.0005, audioContext.currentTime + (n.dur / 1000));
                        
                        osc.connect(gainNode);
                        gainNode.connect(audioContext.destination);
                        
                        osc.start();
                        osc.stop(audioContext.currentTime + (n.dur / 1000));
                    } catch(err) {}
                }, musicalNotes.slice(0, idx).reduce((acc, curr) => acc + curr.dur, 0));
            });

            let totalLen = musicalNotes.reduce((acc, curr) => acc + curr.dur, 0);
            setTimeout(() => {
                if (audioRunning) playMelodyLoop();
            }, totalLen + 800);
        }

        function initializeExperience() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            audioRunning = true;
            playMelodyLoop();
            
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 600);
        }

        // Heavy Matrix Simulation Function with Progressive Build Stages
        function runSimulationStep() {
            let cols = 80;
            let rows = 52;
            let grid = Array(rows).fill(0).map(() => Array(cols).fill({ char: ' ', cls: 'c-white' }));

            // Progressive build phase progression based on simulationTime
            let buildStage = Math.min(simulationTime, 10.0);

            // 1. HAPPY BIRTHDAY TO MY HG Banner Text Matrix (Builds up after t > 3.5)
            if (buildStage >= 3.5) {
                const bannerMatrix = [
                    "H  H   A   PPPPP  PPPP   Y   Y      BBBB   IIIII  RRRR   TTTTT  H  H   A   Y   Y",
                    "H  H  A A  P    P P    P  Y Y       B   B    I    R   R    T    H  H  A A   Y Y ",
                    "HHHH  AAA  PPPPP  PPPPP    Y        BBBB     I    RRRR     T    HHHH  AAA    Y  ",
                    "H  H  A A  P      P        Y        B   B    I    R R      T    H  H  A A    Y  ",
                    "H  H  A A  P      P        Y        BBBB   IIIII  R  R     T    H  H  A A    Y  ",
                    "          T  O        M  Y        H  G       H  G                          "
                ];

                for (let r = 0; r < bannerMatrix.length; r++) {
                    let rStr = bannerMatrix[r];
                    for (let c = 0; c < rStr.length; c++) {
                        let ch = rStr[c];
                        if (ch !== ' ' && r + 1 < rows && c + 1 < cols) {
                            let colorClass = (r === 5) ? 'c-cyan' : ((c % 4 === 0) ? 'c-gold' : (c % 4 === 1 ? 'c-pink' : (c % 4 === 2 ? 'c-purple' : 'c-white')));
                            grid[r + 1][c + 1] = { char: ch, cls: colorClass };
                        }
                    }
                }
            }

            // 2. Confetti & Sparkles Fall Matrix
            if (buildStage >= 1.5) {
                for (let y = 8; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        let pNoise = Math.sin(x * 14.5 + y * 9.2 + simulationTime * 5.0) * Math.cos(x * 4.1 - y * 7.3);
                        if (pNoise > 0.86) {
                            let pChars = ['.', '*', '+', '•', '°', '`', '~', '·'];
                            let pIdx = Math.floor(Math.abs(Math.sin(x * 9 + y * 15 + simulationTime * 12) * 100)) % pChars.length;
                            grid[y][x] = { char: pChars[pIdx], cls: 'c-sparkle' };
                        }
                    }
                }
            }

            // 3. Progressive Cake Building Simulation (Plate -> Body -> Candle -> Flame)
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let nx = (x - 40) / 7.0;
                    let ny = (y - 32) / 3.2;

                    // Stage 1: Plate Forms first (t >= 1.0)
                    if (buildStage >= 1.0 && ny >= 2.1 && ny < 2.5 && Math.abs(nx) < 3.9) {
                        let plateChar = (Math.abs(nx) > 3.5) ? '~' : '=';
                        grid[y][x] = { char: plateChar, cls: 'c-plate' };
                    }

                    // Stage 2: Cake Body Layers Rise up (t >= 2.0)
                    let cakeHeightProgress = Math.min(2.0, (buildStage - 2.0) * 1.5);
                    if (buildStage >= 2.0 && ny >= (2.0 - cakeHeightProgress) && ny < 2.0 && Math.abs(nx) < 2.6 - (ny * 0.12)) {
                        let layerMod = Math.floor(ny * 4) % 2;
                        let isFrosting = (ny < (3.0 - cakeHeightProgress + 0.2) || layerMod === 0);
                        
                        let cakeChars = ['#', '%', '@', 'X', ':', '*', '='];
                        let frostChars = ['~', '_', '•', '.'];
                        
                        let cChar = isFrosting 
                            ? frostChars[Math.floor(Math.abs(Math.sin(x * 3 + y * 5 + simulationTime) * 50)) % frostChars.length]
                            : cakeChars[Math.floor(Math.abs(Math.sin(x * 7 + y * 9 - simulationTime * 2) * 70)) % cakeChars.length];
                        
                        grid[y][x] = { char: cChar, cls: isFrosting ? 'c-frost' : 'c-cake' };
                    }

                    // Stage 3: Candle Stick Appears (t >= 4.5)
                    if (buildStage >= 4.5 && ny >= -1.1 && ny < 0.0 && Math.abs(nx) < 0.24) {
                        let wickChar = (ny > -0.2) ? '|' : '!';
                        grid[y][x] = { char: wickChar, cls: (ny > -0.2) ? 'c-wick' : 'c-cyan' };
                    }

                    // Stage 4: Realistic Flickering Flame Ignores (t >= 5.5)
                    if (buildStage >= 5.5) {
                        let flickerAlpha = Math.sin(simulationTime * 18.5) * 0.12 + Math.cos(simulationTime * 26.2) * 0.08;
                        let flameRadius = Math.pow(nx, 2) + Math.pow(ny + 1.7 - flickerAlpha, 2);
                        
                        let flameBoundary = 0.38 + Math.sin(simulationTime * 10.0 + nx * 6.0) * 0.07;
                        if (flameRadius < flameBoundary) {
                            let flameChars = ['&', '*', 'o', 'v', '^', 'x', 'W', 'Q', '#'];
                            let fIdx = Math.floor(Math.abs(Math.sin(x * 14.5 + y * 20.2 - simulationTime * 14.0) * 90)) % flameChars.length;
                            grid[y][x] = { char: flameChars[fIdx], cls: 'c-flame' };
                        }
                    }
                }
            }

            // Construct heavy HTML string buffer
            let htmlBuffer = "";
            for (let y = 0; y < rows; y++) {
                let lineBuffer = "";
                for (let x = 0; x < cols; x++) {
                    let cell = grid[y][x];
                    if (cell.char === ' ') {
                        lineBuffer += ' ';
                    } else {
                        lineBuffer += `<span class="${cell.cls}">${cell.char}</span>`;
                    }
                }
                htmlBuffer += lineBuffer + "\n";
            }
            screen.innerHTML = htmlBuffer;
            
            // Advance simulation clock
            simulationTime += 0.12;
            if (simulationTime > 18.0) {
                simulationTime = 5.5; // Loop animation smoothly past the build phase
            }
        }

        // Run simulation at high framerate
        setInterval(runSimulationStep, 70);
    </script>
</body>
</html>
