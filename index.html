<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Gugaga! 🎉</title>
    <style>
        body {
            background-color: #030303;
            color: #fca311;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #art-screen {
            text-align: center;
            white-space: pre;
            font-size: 10px;
            line-height: 10px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(252, 163, 17, 0.5);
        }
    </style>
</head>
<body>
    <div id="art-screen">Loading magical animation...</div>

    <script>
        const screen = document.getElementById('art-screen');
        let t = 0;

        function renderFrame() {
            let cols = 78;
            let rows = 45;
            let grid = Array(rows).fill(0).map(() => Array(cols).fill(' '));

            // HAPPY BIRTHDAY Glowing Banner Text
            const banner = [
                "H  H   A   PPPPP  PPPP   Y   Y      BBBB   IIIII  RRRR   TTTTT  H  H   A   Y   Y",
                "H  H  A A  P    P P    P  Y Y       B   B    I    R   R    T    H  H  A A   Y Y ",
                "HHHH  AAA  PPPPP  PPPPP    Y        BBBB     I    RRRR     T    HHHH  AAA    Y  ",
                "H  H  A A  P      P        Y        B   B    I    R R      T    H  H  A A    Y  ",
                "H  H  A A  P      P        Y        BBBB   IIIII  R  R     T    H  H  A A    Y  "
            ];

            for (let r = 0; r < banner.length; r++) {
                let rowStr = banner[r];
                for (let c = 0; c < rowStr.length; c++) {
                    if (rowStr[c] !== ' ' && r + 2 < rows && c + 3 < cols) {
                        grid[r + 2][c + 3] = rowStr[c];
                    }
                }
            }

            // Falling Sparks / Confetti particles (like in the reel)
            for (let y = 8; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let sparkCheck = Math.sin(x * 15 + y * 9 + t * 5);
                    if (sparkCheck > 0.92) {
                        let pChars = ['.', '*', '+', '`', '°'];
                        grid[y][x] = pChars[Math.floor(Math.abs(Math.sin(x + y + t) * 20)) % pChars.length];
                    }
                }
            }

            // Cake geometry parameters
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let nx = (x - 39) / 7.0;
                    let ny = (y - 28) / 3.2;

                    // 1. Plate formation at the bottom
                    if (ny >= 1.9 && ny < 2.4 && Math.abs(nx) < 3.5) {
                        grid[y][x] = (Math.abs(nx) > 3.2) ? '~' : '=';
                    }

                    // 2. Cake Body Layers & Frosting
                    if (ny >= -0.2 && ny < 1.9 && Math.abs(nx) < 2.4 - (ny * 0.15)) {
                        let fillChars = ['.', ':', '#', '%', '@', 'X', '*'];
                        let index = Math.floor(Math.abs(Math.sin(x * 4 + y * 6 + t * 2) * 50)) % fillChars.length;
                        
                        // Top frosting dripping effect
                        if (ny < 0.2) {
                            grid[y][x] = (x % 2 === 0) ? '~' : '_';
                        } else {
                            grid[y][x] = fillChars[index];
                        }
                    }

                    // 3. Candle Stick in the center
                    if (ny >= -1.1 && ny < -0.2 && Math.abs(nx) < 0.22) {
                        grid[y][x] = '|';
                    }

                    // 4. Realistic Flickering Flame
                    let flicker = Math.sin(t * 14) * 0.08 + Math.cos(t * 22) * 0.05;
                    let flameDist = Math.pow(nx, 2) + Math.pow(ny + 1.5 - flicker, 2);
                    
                    if (flameDist < 0.32 + Math.sin(t * 8) * 0.05) {
                        let flameChars = ['&', '*', 'o', 'v', '^', 'x', 'W'];
                        let fIndex = Math.floor(Math.abs(Math.sin(x * 11 + y * 17 - t * 10) * 40)) % flameChars.length;
                        grid[y][x] = flameChars[fIndex];
                    }
                }
            }

            screen.textContent = grid.map(row => row.join('')).join('\n');
            t += 0.12;
        }

        setInterval(renderFrame, 80);
    </script>
</body>
</html>
